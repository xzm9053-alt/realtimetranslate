}

.point-icon {

  flex-shrink: 0;

}

}
.point-content p {

}

.plan-action-box {

}

.m-row-right {

.phone-bottom-nav {

.nav-tab.active {

let currentPlan = 'A';

function render() {
  const plan = PLANS[currentPlan];
  document.getElementById('mockupContent').innerHTML = plan.renderMockup();

  document.getElementById('planDetails').innerHTML = `
    <div class="plan-badge">${plan.badge}</div>
    <h2 class="plan-title">${plan.title}</h2>
    <p class="plan-summary">${plan.summary}</p>

    <div class="points-list">
      ${plan.points.map(pt => `
        <div class="point-item">
          <div class="point-icon">${pt.icon}</div>
          <div class="point-content">
            <h4>${pt.title}</h4>
            <p>${pt.desc}</p>
          </div>
        </div>
      `).join('')}
    </div>

    <div class="plan-action-box">
      <span class="plan-verdict">MIUIX 原生样式 · 层次分明</span>
      <button class="choose-btn" onclick="alert('在终端回复 选方案 ${currentPlan} 即可！')">选用方案 ${currentPlan}</button>
    </div>
  `;

  const buttons = document.querySelectorAll('.tab-btn');
  buttons.forEach((btn, idx) => {
    const keys = ['A', 'B', 'C'];
    if (keys[idx] === currentPlan) {
      btn.classList.add('active');
    } else {
      btn.classList.remove('active');
    }
  });
}

function switchPlan(key) {
  currentPlan = key;
  render();
}

render();
